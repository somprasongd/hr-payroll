map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Resolve upstreams through Docker's embedded DNS so nginx picks up new
# container IPs after `docker compose up` recreates them; a static
# proxy_pass hostname is resolved once at startup and goes stale.
resolver 127.0.0.11 valid=10s ipv6=off;

# Rate limiting zone: 100 requests per second per IP, with burst allowance
# :10m = 10MB shared memory zone for storing request states (~160,000 IP addresses)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    location /api/ {
        # Apply rate limiting with burst of 20 requests
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /pgadmin {
        return 301 /pgadmin/;
    }

    location /pgadmin/ {
        # set must precede the rewrite: `break` halts rewrite-module
        # directives, and set is one of them
        set $pgadmin_upstream pgadmin:80;
        # Variable proxy_pass does not rewrite the URI, so strip the
        # /pgadmin prefix manually to match the old proxy_pass .../ behavior
        rewrite ^/pgadmin/(.*)$ /$1 break;
        proxy_pass http://$pgadmin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /pgadmin;
        proxy_set_header X-Script-Name /pgadmin;
    }

    location / {
        set $web_upstream web:3000;
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

